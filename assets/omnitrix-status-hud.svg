<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <radialGradient id="status-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#07140b"/>
      <stop offset="100%" stop-color="#020603"/>
    </radialGradient>

    <linearGradient id="battery-charge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aa44"/>
      <stop offset="50%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes charge-pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #00FF66); }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .charge-bar { animation: charge-pulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="178" rx="12" fill="url(#status-bg)" stroke="#163821" stroke-width="1.5"/>

  <!-- Plumbers Holographic Badge (Left) -->
  <g transform="translate(24, 24)">
    <!-- Hexagonal Plumber Badge Frame -->
    <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="#08170d" stroke="#00FF66" stroke-width="2" filter="url(#badge-glow)"/>
    <!-- Inner Badge Core -->
    <polygon points="35,8 62,24 62,56 35,72 8,56 8,24" fill="#0b2414" stroke="#39FF14" stroke-width="1"/>
    
    <!-- Plumbers Insignia (Dual triangles resembling hourglass / plumb symbol) -->
    <polygon points="20,26 50,26 35,46" fill="#39FF14"/>
    <polygon points="20,54 50,54 35,34" fill="#39FF14"/>
    <circle cx="35" cy="40" r="3" fill="#ffffff"/>

    <text x="35" y="98" text-anchor="middle" fill="#00FF66" class="mono" font-size="10" font-weight="700">PLUMBER #027</text>
  </g>

  <!-- Middle Telemetry & Operator Dossier -->
  <g transform="translate(120, 24)">
    <text x="0" y="18" fill="#ffffff" class="sans" font-size="18" font-weight="800">
      NITISH PRABAGARAN <tspan fill="#39FF14" font-size="13" class="mono">// GALVAN ARCHITECT</tspan>
    </text>
    <text x="0" y="38" fill="#88c499" class="mono" font-size="11">
      CLEARANCE: LEVEL 20 INTERGALACTIC // DNA PROTOCOLS: 10 READY
    </text>

    <!-- Omnitrix Battery & Master Control Status -->
    <g transform="translate(0, 50)">
      <text x="0" y="12" fill="#528060" class="mono" font-size="10" font-weight="700">OMNITRIX CORE CHARGE (CODON STABILIZED)</text>
      <text x="470" y="12" text-anchor="end" fill="#39FF14" class="mono" font-size="10" font-weight="700">100% MAXIMUM POWER</text>
      
      <!-- Battery Track -->
      <rect x="0" y="20" width="470" height="12" rx="6" fill="#050e08" stroke="#163821" stroke-width="1"/>
      <rect x="2" y="22" width="466" height="8" rx="4" fill="url(#battery-charge)" class="charge-bar"/>
    </g>

    <!-- Sub-status line -->
    <text x="0" y="100" fill="#00FF66" class="mono" font-size="10" font-weight="600">
      DIAL STATUS: [GREEN - READY TO TRANSFORM] • COOLDOWN: 0s • REBOOT: DISABLED
    </text>
  </g>

  <!-- Right Side Stat Callout Box -->
  <g transform="translate(630, 24)">
    <rect x="0" y="0" width="244" height="132" rx="8" fill="#061209" stroke="#14331e" stroke-width="1"/>
    
    <text x="14" y="22" fill="#00FF66" class="mono" font-size="10" font-weight="700">MISSION LOG SUMMARY</text>
    <line x1="14" y1="30" x2="230" y2="30" stroke="#14331e" stroke-width="1"/>

    <text x="14" y="48" fill="#719e80" class="mono" font-size="10">SHIPPED PLATFORMS:</text>
    <text x="160" y="48" fill="#ffffff" class="mono" font-size="10" font-weight="700">4 PRODUCTION</text>

    <text x="14" y="68" fill="#719e80" class="mono" font-size="10">CONCURRENCY MODE:</text>
    <text x="160" y="68" fill="#39FF14" class="mono" font-size="10" font-weight="700">ASYNC NON-BLOCK</text>

    <text x="14" y="88" fill="#719e80" class="mono" font-size="10">AI WORKFLOWS:</text>
    <text x="160" y="88" fill="#ffffff" class="mono" font-size="10" font-weight="700">AGENTS + RAG</text>

    <text x="14" y="108" fill="#719e80" class="mono" font-size="10">HORIZON TARGET:</text>
    <text x="160" y="108" fill="#39FF14" class="mono" font-size="10" font-weight="700">GATE CSE 2028</text>
  </g>
</svg>
