<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D8F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(160px); }
      }
      @keyframes pulse-ring {
        0% { r: 5px; opacity: 0.9; }
        50% { r: 8px; opacity: 0.3; }
        100% { r: 5px; opacity: 0.9; }
      }
      .cursor { animation: blink 1s infinite steps(1); }
      .live-dot { animation: pulse-ring 2s infinite ease-in-out; }
      .mono-txt { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="158" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="1" y1="36" x2="899" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Window Controls (Apple Style) -->
  <circle cx="24" cy="18" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="42" cy="18" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="18" r="5" fill="#10B981" opacity="0.8"/>

  <!-- Terminal Header Title -->
  <text x="85" y="22" fill="#64748b" class="mono-txt" font-size="11" font-weight="600" letter-spacing="1">NITISH-OS :: MISSION CONTROL TERMINAL [SESSION_ACTIVE]</text>

  <!-- Live Status Beacon -->
  <circle cx="830" cy="18" r="6" fill="#00F5A0" opacity="0.25" class="live-dot"/>
  <circle cx="830" cy="18" r="3.5" fill="#00F5A0" filter="url(#glow)"/>
  <text x="844" y="22" fill="#00F5A0" class="mono-txt" font-size="10" font-weight="700" letter-spacing="0.5">ONLINE</text>

  <!-- Grid Tech Accents -->
  <path d="M 850,70 L 870,70 L 870,90" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <path d="M 850,130 L 870,130 L 870,110" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Main Terminal Prompt -->
  <text x="24" y="66" fill="#00F5A0" class="mono-txt" font-size="13" font-weight="600">operator@nitish-station:~$</text>
  <text x="225" y="66" fill="#f8fafc" class="mono-txt" font-size="13" font-weight="500">initialize-profile --target="AI &amp; Backend Engineer"</text>
  <rect x="670" y="54" width="7" height="15" fill="#00F5A0" class="cursor"/>

  <!-- Main Headline Callout -->
  <text x="24" y="105" fill="#ffffff" class="sans-txt" font-size="20" font-weight="700" letter-spacing="-0.5">
    Architecting Autonomous AI Systems &amp; Resilient Backends
  </text>

  <!-- Subtitle Meta Badges -->
  <rect x="24" y="122" width="135" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="32" y="137" fill="#94a3b8" class="mono-txt" font-size="10">SYS_CLASS: BUILDER</text>

  <rect x="168" y="122" width="165" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="176" y="137" fill="#94a3b8" class="mono-txt" font-size="10">CORE: FASTAPI + LLM ORCH</text>

  <rect x="342" y="122" width="145" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="350" y="137" fill="#94a3b8" class="mono-txt" font-size="10">TARGET: GATE CSE '28</text>

  <rect x="496" y="122" width="135" height="22" rx="4" fill="#002b1f" stroke="#00F5A0" stroke-width="1" opacity="0.9"/>
  <text x="506" y="137" fill="#00F5A0" class="mono-txt" font-size="10" font-weight="700">STATUS: OPEN TO SHIP</text>
</svg>
