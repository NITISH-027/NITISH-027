<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="space-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1f14"/>
      <stop offset="50%" stop-color="#050d09"/>
      <stop offset="100%" stop-color="#020503"/>
    </radialGradient>

    <!-- Omnitrix Core Glow -->
    <radialGradient id="omni-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00FF66" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00aa44" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#003311" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Bezel Gradients -->
    <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334139"/>
      <stop offset="30%" stop-color="#1a241e"/>
      <stop offset="70%" stop-color="#0d1410"/>
      <stop offset="100%" stop-color="#1e2c24"/>
    </linearGradient>

    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00FF66" stop-opacity="1"/>
      <stop offset="70%" stop-color="#39FF14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="hyper-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="9" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulse-core {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 15px #00FF66); }
      }
      @keyframes spin-bezel {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scan-beam {
        0% { transform: translateY(-10px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(250px); opacity: 0; }
      }
      @keyframes blink-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes wave-glow {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 200; }
      }
      .omni-center { transform-origin: 120px 120px; animation: pulse-core 3s infinite ease-in-out; }
      .omni-rotor { transform-origin: 120px 120px; animation: spin-bezel 25s infinite linear; }
      .laser-scan { animation: scan-beam 4s infinite linear; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .title-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#space-grad)" stroke="#1a3826" stroke-width="1.8"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#00FF66" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="500" y1="0" x2="500" y2="240"/>
    <line x1="700" y1="0" x2="700" y2="240"/>
  </g>

  <!-- Top Status Border Line with Neon Accent -->
  <line x1="2" y1="2" x2="898" y2="2" stroke="url(#neon-line)" stroke-width="3"/>

  <!-- Laser Scanline effect -->
  <line x1="240" y1="0" x2="880" y2="0" stroke="#00FF66" stroke-width="1" class="laser-scan" opacity="0.4"/>

  <!-- ========================================== -->
  <!-- LEFT: THE OMNITRIX DIAL CORE (CINEMATIC) -->
  <!-- ========================================== -->
  <g id="omnitrix-device">
    <!-- Outer Ambient Glow -->
    <circle cx="120" cy="120" r="95" fill="url(#omni-glow)" opacity="0.4"/>

    <!-- Outer Metal Armor Ring -->
    <circle cx="120" cy="120" r="82" fill="url(#bezel-metal)" stroke="#223d2e" stroke-width="3"/>

    <!-- Bezel Rotor Ring (Spinning ticks) -->
    <g class="omni-rotor">
      <circle cx="120" cy="120" r="70" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="8 14" opacity="0.7"/>
      <circle cx="120" cy="120" r="62" fill="none" stroke="#39FF14" stroke-width="2" stroke-dasharray="2 30" opacity="0.9"/>
      <!-- Rotor Grips (4 Bezel Notches) -->
      <rect x="116" y="44" width="8" height="12" rx="2" fill="#00FF66" filter="url(#soft-glow)"/>
      <rect x="116" y="184" width="8" height="12" rx="2" fill="#00FF66" filter="url(#soft-glow)"/>
      <rect x="44" y="116" width="12" height="8" rx="2" fill="#00FF66" filter="url(#soft-glow)"/>
      <rect x="184" y="116" width="12" height="8" rx="2" fill="#00FF66" filter="url(#soft-glow)"/>
    </g>

    <!-- Inner Dial Faceplate (Deep Black) -->
    <circle cx="120" cy="120" r="54" fill="#050a07" stroke="#00FF66" stroke-width="2.5" filter="url(#soft-glow)"/>

    <!-- ICONIC OMNITRIX HOURGLASS INTERFACE (GLOWING GREEN & BLACK) -->
    <g class="omni-center">
      <!-- Glow under hourglass -->
      <circle cx="120" cy="120" r="42" fill="#00FF66" opacity="0.15" filter="url(#hyper-glow)"/>
      
      <!-- Top Green Triangle of Hourglass -->
      <polygon points="88,88 152,88 120,118" fill="#39FF14" filter="url(#soft-glow)"/>
      <!-- Bottom Green Triangle of Hourglass -->
      <polygon points="88,152 152,152 120,122" fill="#39FF14" filter="url(#soft-glow)"/>
      
      <!-- Left Black Wedge -->
      <polygon points="88,88 120,120 88,152" fill="#07120a" stroke="#00FF66" stroke-width="1.5"/>
      <!-- Right Black Wedge -->
      <polygon points="152,88 120,120 152,152" fill="#07120a" stroke="#00FF66" stroke-width="1.5"/>

      <!-- Center Intersection Core Pip -->
      <circle cx="120" cy="120" r="3.5" fill="#ffffff" filter="url(#hyper-glow)"/>
    </g>

    <!-- Tactical HUD Corner Ring Bracket -->
    <path d="M 38,50 A 90 90 0 0 1 70,32" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.6"/>
    <path d="M 170,32 A 90 90 0 0 1 202,50" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.6"/>
    <path d="M 38,190 A 90 90 0 0 0 70,208" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.6"/>
    <path d="M 170,208 A 90 90 0 0 0 202,190" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: GALVAN PRIME / HUD COMMAND STREAM -->
  <!-- ========================================== -->
  <g transform="translate(236, 24)">
    <!-- Top System Telemetry Bar -->
    <rect x="0" y="0" width="630" height="26" rx="5" fill="#08140c" stroke="#14331e" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="4.5" fill="#39FF14" filter="url(#soft-glow)"/>
    <text x="26" y="17" fill="#00FF66" class="mono" font-size="10.5" font-weight="700" letter-spacing="1">
      OMNITRIX_OS // GALVAN PRIME CODON STREAM v10.0 [ACTIVE]
    </text>
    
    <text x="618" y="17" text-anchor="end" fill="#719e80" class="mono" font-size="10" font-weight="600">
      SEC_CLEARANCE: LVL_20 [AZMUTH]
    </text>

    <!-- Hero Title -->
    <text x="0" y="66" fill="#ffffff" class="title-sans" font-size="25" font-weight="900" letter-spacing="-0.5">
      NITISH PRABAGARAN <tspan fill="#39FF14" font-size="20">// OPERATOR-027</tspan>
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="0" y="92" fill="#88c499" class="mono" font-size="13" font-weight="500">
      &gt; "IT'S HERO TIME." | ARCHITECTING AUTONOMOUS AI &amp; BACKEND PLATFORMS
    </text>

    <!-- Terminal Command Line Prompt -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="630" height="34" rx="6" fill="#050e08" stroke="#1d4229" stroke-width="1"/>
      <text x="14" y="22" fill="#00FF66" class="mono" font-size="12" font-weight="700">azmuth@omnitrix-core:~$</text>
      <text x="215" y="22" fill="#e2f5e8" class="mono" font-size="12">omnitrix --engage-dna="AI_AGENTS + FASTAPI + POSTGRES"</text>
      <rect x="608" y="10" width="7" height="15" fill="#39FF14" style="animation: blink-cursor 1s infinite steps(1);"/>
    </g>

    <!-- Tactical Attribute HUD Pills -->
    <g transform="translate(0, 154)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="24" rx="4" fill="#0a1a10" stroke="#00FF66" stroke-width="1"/>
      <text x="10" y="16" fill="#39FF14" class="mono" font-size="10" font-weight="700">DNA_SAMPLES: 10/10</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="148" height="24" rx="4" fill="#0a1a10" stroke="#1a3d25" stroke-width="1"/>
      <text x="158" y="16" fill="#88c499" class="mono" font-size="10" font-weight="600">CHARGE: 100% READY</text>

      <!-- Pill 3 -->
      <rect x="306" y="0" width="158" height="24" rx="4" fill="#0a1a10" stroke="#1a3d25" stroke-width="1"/>
      <text x="316" y="16" fill="#88c499" class="mono" font-size="10" font-weight="600">MODE: MASTER CONTROL</text>

      <!-- Pill 4: Location -->
      <rect x="474" y="0" width="156" height="24" rx="4" fill="#062112" stroke="#00FF66" stroke-width="1"/>
      <text x="484" y="16" fill="#00FF66" class="mono" font-size="10" font-weight="700">SECTOR: INDIA // REMOTE</text>
    </g>
  </g>
</svg>
