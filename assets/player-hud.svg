<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="xp-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes xp-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .label-dim { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: 1px; }
      .val-bright { fill: #f1f5f9; font-size: 13px; font-weight: 700; }
      .stat-badge { fill: #0f172a; stroke: #1e293b; stroke-width: 1; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="238" rx="12" fill="url(#hud-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Header Column: Player Identity -->
  <g transform="translate(24, 24)">
    <!-- Avatar / Hex Emblem placeholder -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#0f172a" stroke="#00F5A0" stroke-width="1.5"/>
    <text x="30" y="38" text-anchor="middle" fill="#00F5A0" class="mono" font-size="22" font-weight="800">&gt;_</text>
    
    <!-- Player Name & Level -->
    <text x="75" y="24" fill="#ffffff" class="sans" font-size="18" font-weight="700">Nitish Prabagaran</text>
    <text x="75" y="44" fill="#00F5A0" class="mono" font-size="12" font-weight="600">CLASS: SYSTEM_ARCHITECT // LVL 21 [CS_UNDERGRAD]</text>

    <!-- Badges Row -->
    <rect x="75" y="52" width="130" height="18" rx="4" fill="#1e293b" />
    <text x="82" y="65" fill="#94a3b8" class="mono" font-size="9" font-weight="600">ROLE: AI &amp; BACKEND</text>

    <rect x="212" y="52" width="115" height="18" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
    <text x="220" y="65" fill="#34d399" class="mono" font-size="9" font-weight="700">READY_FOR_DEPLOY</text>
  </g>

  <!-- Top Right Stats Telemetry -->
  <g transform="translate(620, 24)">
    <rect x="0" y="0" width="256" height="70" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="20" fill="#64748b" class="mono" font-size="10" font-weight="600">CORE STATS // TELEMETRY</text>
    
    <text x="14" y="42" fill="#94a3b8" class="mono" font-size="11">CORE ENGINE:</text>
    <text x="105" y="42" fill="#f8fafc" class="mono" font-size="11" font-weight="700">Python 3.12 + FastAPI</text>
    
    <text x="14" y="58" fill="#94a3b8" class="mono" font-size="11">DATA STORE:</text>
    <text x="105" y="58" fill="#f8fafc" class="mono" font-size="11" font-weight="700">PostgreSQL + Vector</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="108" x2="876" y2="108" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- XP Progress Bar Component -->
  <g transform="translate(24, 122)">
    <text x="0" y="12" fill="#64748b" class="mono" font-size="11" font-weight="600">EXP TO NEXT RANK [TIER 2 :: PRODUCTION ENGINEER]</text>
    <text x="852" y="12" text-anchor="end" fill="#00F5A0" class="mono" font-size="11" font-weight="700">8,450 / 10,000 XP (84.5%)</text>
    
    <!-- Outer Track -->
    <rect x="0" y="22" width="852" height="12" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Filled Gradient Bar -->
    <rect x="1" y="23" width="720" height="10" rx="5" fill="url(#xp-bar-grad)"/>
  </g>

  <!-- Bottom Attribute Badges -->
  <g transform="translate(24, 180)">
    <!-- Attribute 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="42" rx="6" class="stat-badge"/>
      <text x="12" y="18" class="label-dim mono">ATTR_01 // SPEED</text>
      <text x="12" y="34" class="val-bright mono">Async FastAPI [High Concurrency]</text>
    </g>

    <!-- Attribute 2 -->
    <g transform="translate(216, 0)">
      <rect x="0" y="0" width="200" height="42" rx="6" class="stat-badge"/>
      <text x="12" y="18" class="label-dim mono">ATTR_02 // INTELLIGENCE</text>
      <text x="12" y="34" class="val-bright mono">LLMs, OCR &amp; Autonomous Agents</text>
    </g>

    <!-- Attribute 3 -->
    <g transform="translate(432, 0)">
      <rect x="0" y="0" width="200" height="42" rx="6" class="stat-badge"/>
      <text x="12" y="18" class="label-dim mono">ATTR_03 // RELIABILITY</text>
      <text x="12" y="34" class="val-bright mono">PostgreSQL + Docker Envs</text>
    </g>

    <!-- Attribute 4 -->
    <g transform="translate(648, 0)">
      <rect x="0" y="0" width="204" height="42" rx="6" class="stat-badge" stroke="#059669"/>
      <text x="12" y="18" fill="#34d399" class="mono" font-size="10" font-weight="600">CURRENT CAMPAIGN</text>
      <text x="12" y="34" fill="#00F5A0" class="mono" font-size="12" font-weight="700">GATE CSE 2028 + MSME OS</text>
    </g>
  </g>
</svg>
